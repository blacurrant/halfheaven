[project]
name = "halfheaven"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "requests>=2.31", "numpy>=1.26", "opencv-python-headless>=4.9", "scenedetect>=0.6", "pillow>=10"]

[project.optional-dependencies]
# Subject separation (analyze/matte.py). Install mediapipe with --no-deps: its
# declared opencv-contrib-python would add a third cv2 beside the two already here.
#   pip install torch absl-py flatbuffers certifi matplotlib
#   pip install --no-deps mediapipe==1.0.1
matte = ["torch>=2.2", "absl-py", "flatbuffers", "certifi", "matplotlib"]
# Sharper word timings, beat tracking and shot detection (groq/align.py,
# analyze/fingerprint.py, analyze/shots.py). Each falls back to the lighter
# method when this is not installed.
ml = ["whisperx>=3.8", "beat-this>=1.1", "transnetv2-pytorch>=1.0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["halfheaven*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
