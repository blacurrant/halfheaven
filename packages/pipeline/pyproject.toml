[project]
name = "halfheaven"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "requests>=2.31", "numpy>=1.26", "opencv-python-headless>=4.9", "scenedetect>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["halfheaven*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
